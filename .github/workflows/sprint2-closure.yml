name: Sprint 2 closure verification

on:
  push:
    branches:
      - codex/sprint-2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure:
    name: closure-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.12"

      - name: Install locked dependencies
        run: uv sync --extra dev --frozen

      - name: Full pytest suite
        run: uv run pytest -q

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: HTTP smoke
        run: uv run python scripts/smoke_http.py
