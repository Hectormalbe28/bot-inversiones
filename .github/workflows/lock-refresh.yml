name: Refresh uv lock

on:
  push:
    branches:
      - codex/sprint-3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.12"
      - name: Refresh lock
        run: uv lock
      - name: Upload lock
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-uv-lock
          path: uv.lock
