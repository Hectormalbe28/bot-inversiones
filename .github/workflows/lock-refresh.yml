name: Refresh uv lock

on:
  push:
    branches:
      - codex/sprint-3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.12"
      - name: Refresh lock
        run: uv lock
      - name: Commit refreshed lock when needed
        shell: bash
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "build: refresh uv lock"
          git push origin HEAD:codex/sprint-3
